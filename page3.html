let currentCharacter = null;

function openProfile(name) {
  currentCharacter = name;

  const character = characters[name];
  document.getElementById("profileCharacter").src =
    name === "ellayah"
    ? "images/ellayah.png"
    : "images/xidize.png";

  const selection = document.getElementById("selection");
  const profile = document.getElementById("profile");

  selection.classList.remove("active");
  profile.classList.remove("ellayah-world", "xidize-world");

  profile.classList.add("active", character.theme);

  document.getElementById("profileName").textContent = character.name;
  document.getElementById("profileRole").textContent = character.role;
  document.getElementById("profileKicker").textContent =
    "SAVE " + character.number + " / HERO PROFILE";

  document.getElementById("worldCaption").textContent = character.world;
  document.getElementById("profileWorld").textContent = character.world;

  document.querySelectorAll(".tab").forEach(tab =>
    tab.classList.remove("active")
  );

  document.querySelector('.tab[onclick*="bio"]').classList.add("active");

  changeTab("bio", document.querySelector(".tab"));
  createParticles(name === "xidize" ? "night" : "forest");

  window.scrollTo(0, 0);
  playSound(440);
}

function goBack() {
  document.getElementById("profile").classList.remove("active");
  document.getElementById("selection").classList.add("active");
  window.scrollTo(0, 0);
  playSound(330);
}

function changeTab(type, button) {
  const character = characters[currentCharacter];
  const content = document.getElementById("tabContent");

  document.querySelectorAll(".tab").forEach(tab =>
    tab.classList.remove("active")
  );

  if (button) button.classList.add("active");

  if (type === "bio") {
  content.innerHTML = `
    <div class="bio-text">
      ${character.bio.map(item => `
        <p><span>${item[0]}</span> ${item[1]}</p>
      `).join("")}
    </div>
  `;
}

  if (type === "abilities") {
    content.innerHTML = `
      <div class="ability-list">
        ${character.abilities.map((ability, index) => `
          <button class="ability" onclick="abilitySound(${index})">
            <strong>${ability[0]}</strong>
            <span>${ability[1]}</span>
          </button>
        `).join("")}
      </div>
    `;
  }

  if (type === "socials") {
    content.innerHTML = `
      <div class="social-list">
        ${character.socials.map(social => `
          <a class="social-link"
             href="${social[1]}"
             target="_blank"
             rel="noopener noreferrer">${social[0]} ↗</a>
        `).join("")}
      </div>
    `;
  }
  if (type === "discography") {
  content.innerHTML = `
    <div class="discography-grid">
      ${character.discography?.map(release => `
        <a class="release-card"
           href="${release.link}"
           target="_blank"
           rel="noopener noreferrer">

          <img src="${release.cover}" alt="${release.title}">

          <div class="release-title">${release.title}</div>
          <div class="release-meta">
            ${release.type} · ${release.year}
          </div>

        </a>
      `).join("") || '<p class="empty-discography">NO RELEASES YET</p>'}
    </div>
  `;
}

  playSound(520);
}

function createParticles(type) {
  const container = document.getElementById("particles");
  container.innerHTML = "";

  for (let i = 0; i < 32; i++) {
    const particle = document.createElement("div");
    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";
    particle.style.animationDuration = (8 + Math.random() * 14) + "s";
    particle.style.animationDelay = (-Math.random() * 15) + "s";
    particle.style.opacity = Math.random() * .8;

    if (type === "night") {
      particle.style.width = "2px";
      particle.style.height = "2px";
    }

    container.appendChild(particle);
  }
}

/* Small generated interface sounds */

let audioContext;

function playSound(frequency) {
  try {
    audioContext = audioContext || new
      (window.AudioContext || window.webkitAudioContext)();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(.045, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .16
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .16);
  } catch (error) {}
}

function abilitySound(index) {
  playSound(600 + index * 110);
}
